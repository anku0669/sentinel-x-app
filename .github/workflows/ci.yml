name: CI

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m py_compile pentaforge.py check_tools.py
      - name: Check module inventory
        run: |
          python - <<'PY'
          import ast
          tree = ast.parse(open('pentaforge.py').read())
          modules = []
          for n in tree.body:
              if isinstance(n, ast.Assign):
                  for t in n.targets:
                      if isinstance(t, ast.Name) and t.id == 'MODULES':
                          modules = ast.literal_eval(n.value)
          assert len(modules) == 50, len(modules)
          print('50 modules validated')
          PY
